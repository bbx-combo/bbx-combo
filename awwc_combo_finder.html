<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBO Combo Finder</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#171b2e;
    --panel2:#1e2340;
    --border:#2c3357;
    --text:#eef0fb;
    --muted:#9aa0c3;
    --accent:#ff5d3b;
    --accent2:#3bd6ff;
    --gold:#ffcf56;
    --good:#4ade80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,93,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(59,214,255,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:28px;}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-size:11px;
    color:var(--accent2);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(28px,5vw,40px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{color:var(--muted);font-size:14.5px;max-width:700px;line-height:1.5;}
  .data-note{color:var(--gold);font-size:12.5px;margin-top:7px;}
  .data-note strong{color:var(--text);}
  .best-toggle{
    display:flex;align-items:center;gap:7px;color:var(--muted);
    font-size:12.5px;cursor:pointer;
  }
  .best-toggle input{accent-color:var(--accent2);cursor:pointer;}
  .stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 14px;
    font-size:12.5px;
    color:var(--muted);
  }
  .stat b{color:var(--text);font-size:15px;display:block;}

  .picker{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:26px 0 8px;
  }
  @media (max-width:640px){ .picker{grid-template-columns:1fr;} }

  .slot{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    position:relative;
  }
  .slot.locked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .slot-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .slot-label .badge{
    background:var(--accent);
    color:#1a0d08;
    border-radius:6px;
    padding:1px 6px;
    font-size:10px;
    font-weight:800;
    letter-spacing:0;
  }
  select, input[type=text]{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:15px;
    outline:none;
    appearance:none;
  }
  select:focus, input:focus{border-color:var(--accent2);}
  .clear-btn{
    margin-top:8px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .clear-btn:hover{color:var(--text);}

  .reset-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .reset-row button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    padding:8px 14px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
  }
  .reset-row button:hover{color:var(--text);border-color:var(--accent2);}

  .results{margin-top:8px;}
  .results h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .results h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;}

  .combo-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .combo-title{font-size:15px;font-weight:600;margin-bottom:2px;}
  .combo-title .pts{color:var(--gold);font-weight:800;}
  .combo-sub{color:var(--muted);font-size:12.5px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    padding:0 10px 8px;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:9px 10px;
    border-bottom:1px solid rgba(255,255,255,0.04);
    font-size:14px;
  }
  tr:last-child td{border-bottom:none;}
  tr.rank1 td:first-child{color:var(--gold);font-weight:800;}
  .name-cell{font-weight:600;}
  .bar-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bar-track{
    flex:1;
    height:6px;
    background:var(--panel2);
    border-radius:4px;
    overflow:hidden;
    min-width:60px;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    border-radius:4px;
  }
  .pts-val{
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    font-size:12.5px;
    min-width:44px;
    text-align:right;
  }
  .row-btn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    font-size:11px;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .row-btn:hover{border-color:var(--accent2);color:var(--accent2);}

  .empty-state{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:40px 20px;
    border:1px dashed var(--border);
    border-radius:12px;
  }
  .empty-state .big{font-size:32px;display:block;margin-bottom:8px;}

  footer{
    margin-top:40px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WBO Combo Finder</h1>
    <div class="sub">Pick any one or two parts to explore the August 2026 WBO tournament meta.</div>
    <div class="data-note"><strong>August 2026 only.</strong> Rankings are based solely on WBO tournaments held during August 2026. Data taken from AWWC.</div>
    <div class="stats" id="statsRow"></div>
  </header>

  <div class="reset-row">
    <label class="best-toggle"><input type="checkbox" id="bestPerBlade"> Best combo per blade</label>
    <button id="resetBtn">Reset selections</button>
  </div>

  <div class="picker">
    <div class="slot" id="slot-blade">
      <div class="slot-label"><span>Blade</span></div>
      <select id="sel-blade"><option value="">Any blade</option></select>
      <button class="clear-btn" data-target="blade">clear</button>
    </div>
    <div class="slot" id="slot-ratchet">
      <div class="slot-label"><span>Ratchet</span></div>
      <select id="sel-ratchet"><option value="">Any ratchet</option></select>
      <button class="clear-btn" data-target="ratchet">clear</button>
    </div>
    <div class="slot" id="slot-bit">
      <div class="slot-label"><span>Bit</span></div>
      <select id="sel-bit"><option value="">Any bit</option></select>
      <button class="clear-btn" data-target="bit">clear</button>
    </div>
  </div>

  <div class="results" id="results"></div>

  
</div>

// ---- helpers ----
const fmt = n => {
  const r = Math.round(n*100)/100;
  return (r % 1 === 0) ? String(r) : String(r);
};

function uniqueSorted(arr){
  return [...new Set(arr)].filter(x=>x!=='').sort((a,b)=>a.localeCompare(b));
}

const allBlades = uniqueSorted(COMBOS.map(c=>c.blade));
const allRatchets = uniqueSorted(COMBOS.map(c=>c.ratchet)).sort((a,b)=>{
  // sort ratchets numerically by leading number where possible
  const na = parseInt(a); const nb = parseInt(b);
  if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
  return a.localeCompare(b);
});
const allBits = uniqueSorted(COMBOS.map(c=>c.bit));

const state = { blade:'', ratchet:'', bit:'' };

const selBlade = document.getElementById('sel-blade');
const selRatchet = document.getElementById('sel-ratchet');
const selBit = document.getElementById('sel-bit');
const resultsEl = document.getElementById('results');
const statsRow = document.getElementById('statsRow');
const bestPerBlade = document.getElementById('bestPerBlade');

function populateSelect(sel, items, current){
  const existing = sel.value;
  sel.innerHTML = '<option value="">Any</option>' + items.map(x=>`<option value="${x.replace(/"/g,'&quot;')}">${x}</option>`).join('');
  sel.value = current || '';
}

function initSelects(){
  populateSelect(selBlade, allBlades, state.blade);
  selBlade.options[0].textContent = 'Any blade';
  populateSelect(selRatchet, allRatchets, state.ratchet);
  selRatchet.options[0].textContent = 'Any ratchet';
  populateSelect(selBit, allBits, state.bit);
  selBit.options[0].textContent = 'Any bit';
}

function matches(c, ignore){
  if(ignore!=='blade' && state.blade && c.blade!==state.blade) return false;
  if(ignore!=='ratchet' && state.ratchet && c.ratchet!==state.ratchet) return false;
  if(ignore!=='bit' && state.bit && c.bit!==state.bit) return false;
  return true;
}

function aggregateBy(field, ignoreField){
  const totals = new Map();
  for(const c of COMBOS){
    if(!matches(c, ignoreField)) continue;
    const key = c[field];
    if(!key) continue;
    totals.set(key, (totals.get(key)||0) + c.points);
  }
  return [...totals.entries()].sort((a,b)=>b[1]-a[1]);
}

function updateSlotStyles(){
  document.getElementById('slot-blade').classList.toggle('locked', !!state.blade);
  document.getElementById('slot-ratchet').classList.toggle('locked', !!state.ratchet);
  document.getElementById('slot-bit').classList.toggle('locked', !!state.bit);
}

function statPill(label, value){
  return `<div class="stat"><b>${value}</b>${label}</div>`;
}

function renderStats(){
  statsRow.innerHTML =
    statPill('unique blades', allBlades.length) +
    statPill('ratchets seen', allRatchets.length) +
    statPill('bit types', allBits.length) +
    statPill('recorded combos', COMBOS.length);
}

function makeTable(rows, colLabel, onPick, field){
  if(rows.length===0){
    return `<div class="empty-state"><span class="big">¯\\_(ツ)_/¯</span>No recorded combos match this selection yet.</div>`;
  }
  const max = rows[0][1];
  const top = rows.slice(0,10);
  const body = top.map(([name,pts],i)=>`
    <tr class="${i===0?'rank1':''}">
      <td>${i+1}</td>
      <td class="name-cell">${name}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(pts/max)*100)}%"></div></div>
          <span class="pts-val">${fmt(pts)}</span>
        </div>
      </td>
      <td><button class="row-btn" data-field="${field}" data-value="${name.replace(/"/g,'&quot;')}">Use this</button></td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th>#</th><th>${colLabel}</th><th>Points</th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function render(){
  updateSlotStyles();
  const chosen = ['blade','ratchet','bit'].filter(f=>state[f]);
  let html = '';

  if(chosen.length===0){
    // show overall top combos
    const ranked = [...COMBOS].sort((a,b)=>b.points-a.points);
    let top;
    if(bestPerBlade.checked){
      const seen = new Set();
      top = ranked.filter(c=>{
        const key = c.bladeKey || c.blade;
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0,10);
    } else {
      top = ranked.slice(0,10);
    }
    html += `<h2>${bestPerBlade.checked ? 'Top combo for each blade' : 'Top combos overall'}</h2>`;
    html += `<div class="combo-card"><div class="combo-sub">${bestPerBlade.checked ? 'Showing only the highest-scoring full combination for each blade.' : 'Highest-scoring combinations from the August dataset.'} Pick a blade, ratchet, or bit above to get targeted suggestions.</div>
      <table><thead><tr><th>#</th><th>Blade</th><th>Ratchet</th><th>Bit</th><th>Points</th></tr></thead><tbody>
      ${top.map((c,i)=>`<tr class="${i===0?'rank1':''}"><td>${i+1}</td><td class="name-cell">${c.blade}</td><td>${c.ratchet||'—'}</td><td>${c.bit}</td><td class="pts-val">${fmt(c.points)}</td></tr>`).join('')}
      </tbody></table></div>`;
  } else if(chosen.length===3){
    const exact = COMBOS.find(c=>matches(c,null));
    html += `<h2>Exact combo</h2>`;
    if(exact){
      html += `<div class="combo-card"><div class="combo-title">${state.blade} · ${state.ratchet} · ${state.bit} <span class="pts">${fmt(exact.points)} pts</span></div>
        <div class="combo-sub">This exact combo appears in the tournament data.</div></div>`;
    } else {
      html += `<div class="empty-state"><span class="big">¯\\_(ツ)_/¯</span>This exact blade + ratchet + bit combo hasn't shown up in the data. Clear one part to see what's been recorded nearby.</div>`;
    }
  } else if(chosen.length===1){
    const known = chosen[0];
    const targets = ['blade','ratchet','bit'].filter(f=>f!==known);
    for(const t of targets){
      const rows = aggregateBy(t, known); // ignore nothing extra, only known is locked
      // recompute properly: we want combos matching only 'known', grouped by t
      const totals = new Map();
      for(const c of COMBOS){
        if(c[known] !== state[known]) continue;
        const key = c[t];
        if(!key) continue;
        totals.set(key,(totals.get(key)||0)+c.points);
      }
      const sorted = [...totals.entries()].sort((a,b)=>b[1]-a[1]);
      const label = t==='blade'?'Blade':t==='ratchet'?'Ratchet':'Bit';
      html += `<h2>Best ${label.toLowerCase()}s with this ${known}</h2>`;
      html += `<div class="combo-card">${makeTable(sorted, label, null, t)}</div>`;
    }
  } else if(chosen.length===2){
    const missing = ['blade','ratchet','bit'].find(f=>!chosen.includes(f));
    const totals = new Map();
    for(const c of COMBOS){
      if(!chosen.every(f=>c[f]===state[f])) continue;
      const key = c[missing];
      if(!key) continue;
      totals.set(key,(totals.get(key)||0)+c.points);
    }
    const sorted = [...totals.entries()].sort((a,b)=>b[1]-a[1]);
    const label = missing==='blade'?'Blade':missing==='ratchet'?'Ratchet':'Bit';
    const knownDesc = chosen.map(f=>state[f]).join(' + ');
    html += `<h2>Best ${label.toLowerCase()}s for ${knownDesc}</h2>`;
    html += `<div class="combo-card">${makeTable(sorted, label, null, missing)}</div>`;
  }

  resultsEl.innerHTML = html;

  // wire up "use this" buttons
  resultsEl.querySelectorAll('.row-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const field = btn.getAttribute('data-field');
      const value = btn.getAttribute('data-value');
      state[field] = value;
      syncSelectsFromState();
      render();
    });
  });
}

function syncSelectsFromState(){
  selBlade.value = state.blade;
  selRatchet.value = state.ratchet;
  selBit.value = state.bit;
}

selBlade.addEventListener('change', ()=>{ state.blade = selBlade.value; render(); });
selRatchet.addEventListener('change', ()=>{ state.ratchet = selRatchet.value; render(); });
selBit.addEventListener('change', ()=>{ state.bit = selBit.value; render(); });
bestPerBlade.addEventListener('change', render);

document.querySelectorAll('.clear-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const f = btn.getAttribute('data-target');
    state[f] = '';
    syncSelectsFromState();
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.blade=''; state.ratchet=''; state.bit='';
  bestPerBlade.checked = false;
  syncSelectsFromState();
  render();
});

initSelects();
renderStats();
render();
</script>
